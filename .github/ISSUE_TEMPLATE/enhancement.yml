name: "🚀 Enhancement"
description: Suggest improvements to an existing feature
labels: ["type:enhancement", "status:discussion"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What does the current feature do?
      placeholder: |
        The `draftable:list` command outputs all drafts without pagination...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How could this be improved?
      placeholder: |
        Allow filtering drafts by model or date range...
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - generator
        - validation
        - docs
        - tests
        - other
